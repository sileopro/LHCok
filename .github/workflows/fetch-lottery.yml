# 抓取 500.com 开奖数据，写入 lottery/
# - 晚间开奖窗口高频：北京时间 20:00–23:00 每 10 分钟
# - 其它时段补抓：每 2 小时一次（官网延迟发布 / Actions 排队错过窗口时仍能补上）
# 脚本按期号去重，无新数据不提交
name: 福彩数据抓取 (500.com)

on:
  schedule:
    # ===== 晚间高频（北京 = UTC+8）=====
    # 20:00–20:50
    - cron: '0,10,20,30,40,50 12 * * *'
    # 21:00–21:50
    - cron: '0,10,20,30,40,50 13 * * *'
    # 22:00–22:50
    - cron: '0,10,20,30,40,50 14 * * *'
    # 23:00 收尾一次
    - cron: '0 15 * * *'

    # ===== 其它时段补抓（避开上面的 12–15 UTC）=====
    # 北京 01/03/05/07/09/11/13/15/17/19 点
    - cron: '0 0,2,4,6,8,10,16,18,20,22 * * *'

  workflow_dispatch: {}

concurrency:
  group: fetch-lottery-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch latest lottery (500.com)
        run: python fetchmaney.py

      - name: Commit and push if lottery changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add lottery/
          if git diff --staged --quiet; then
            echo "No lottery changes, skip commit."
          else
            git commit -m "chore(lottery): update from 500.com [skip ci]"
            # 避免 non-fast-forward：push 前先同步远端，再重试 push
            for i in 1 2 3; do
              git fetch origin main
              git rebase origin/main || (git rebase --abort && exit 1)
              git push && exit 0
              echo "Push rejected, retry... ($i/3)"
              sleep 2
            done
            echo "Push failed after retries."
            exit 1
          fi
