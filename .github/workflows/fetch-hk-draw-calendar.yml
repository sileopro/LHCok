# 从香港马会官网写入 lottery.txt（搅珠日 / 金多宝）
# 每月 15 日起开始抓；若官网延迟公布或某次失败，15–28 日每天继续抓，直到下月写入成功。
# GitHub runner 在国外，不需要 VPN。格式：2026.09: 1,3,5,... 金多宝26
name: 港彩搅珠日期 (马会官网)

on:
  schedule:
    # 北京时间 15–28 日 10:00 = UTC 02:00
    - cron: '0 2 15-28 * *'
    # 北京时间 15–28 日 18:00 = UTC 10:00（官网晚公布时当天傍晚再试）
    - cron: '0 10 15-28 * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: fetch-hk-draw-calendar-${{ github.ref }}
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: 设置时区
        uses: szenius/set-timezone@v1.0
        with:
          timezoneLinux: Asia/Shanghai

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 从马会官网更新 lottery.txt
        run: python fetch_hk_draw_calendar.py
        env:
          TZ: Asia/Shanghai

      - name: 有变化则提交 lottery.txt
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add lottery.txt
          if git diff --staged --quiet; then
            echo "lottery.txt 无变化，跳过提交"
            exit 0
          fi
          git commit -m "chore(lottery.txt): 同步马会搅珠日期 $(date '+%Y-%m-%d') [skip ci]"
          for i in 1 2 3; do
            git fetch origin main
            git rebase origin/main || (git rebase --abort && exit 1)
            git push && exit 0
            echo "Push 失败，重试 $i/3"
            sleep 2
          done
          exit 1
