# 从香港马会官网写入 lottery.txt（搅珠日 / 金多宝）
# 每月 15 日起开始抓；若官网延迟公布或某次失败，15–28 日每天继续抓，直到下月写入成功。
# 仓库里没有 fetch_hk_draw_calendar.py 时会自动创建。
name: 港彩搅珠日期 (马会官网)

on:
  schedule:
    - cron: '0 2 15-28 * *'
    - cron: '0 10 15-28 * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: fetch-hk-draw-calendar-${{ github.ref }}
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: 设置时区
        uses: szenius/set-timezone@v1.0
        with:
          timezoneLinux: Asia/Shanghai

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 确保脚本存在并从马会官网更新 lottery.txt
        env:
          TZ: Asia/Shanghai
        run: |
          set -e
          echo "===== 仓库根目录 ====="
          ls -la
          if [ ! -f fetch_hk_draw_calendar.py ]; then
            FOUND=$(find . -type f \( -name 'fetch_hk_draw_calendar.py' -o -name 'fetch-hk-draw-calendar.py' \) | head -n 1)
            if [ -n "$FOUND" ]; then
              echo "在 $FOUND 找到脚本，复制到仓库根目录"
              cp "$FOUND" ./fetch_hk_draw_calendar.py
            fi
          fi
          if [ ! -f lottery.txt ]; then
            echo "lottery.txt 不存在，先创建空文件"
            : > lottery.txt
          fi
          if [ ! -f fetch_hk_draw_calendar.py ]; then
            echo "根目录没有脚本，自动创建 fetch_hk_draw_calendar.py"
            cat > fetch_hk_draw_calendar.py << 'ENDSCRIPT'
          #!/usr/bin/env python3
          # -*- coding: utf-8 -*-
          import json, os, re, sys, urllib.error, urllib.request
          from datetime import datetime
          API_URL = "https://consvc.hkjc.com/JCBW/api/graph"
          API_KEY = "{FF2309B7-E8BB-49B2-82A7-36AE0B48F171}"
          SITECORE_PATH = "/sitecore/content/Sites/JCBW/NextDrawSchedule/Schedule"
          QUERY = (
              "query MarksixFixtures($path: String!, $lang: String!) { "
              "legends: item(path: \"/sitecore/content/Sites/JCBW/NextDrawSchedule/DrawTypeLegend\", language: $lang) { "
              "children { key: name name: field(name: \"LegendName\") { value } } } "
              "item(path: $path, language: $lang) { years: children { year: name months: children { "
              "key: name month: field(name: \"DrawMonth\") { value } "
              "dates: field(name: \"NormalDrawDates\") { ... on MultilistField { date: targetItems { value: name } } } "
              "snowballs: field(name: \"SnowballDrawDates\") { ... on MultilistField { date: targetItems { value: name } } } "
              "} } } }"
          )
          LINE_RE = re.compile(r"^(\d{4})[.\-/](\d{1,2})\s*[:：]\s*(.+)$")
          ROOT = os.path.dirname(os.path.abspath(__file__))
          OUT_PATH = os.path.join(ROOT, "lottery.txt")

          def fetch_official():
              payload = json.dumps({
                  "operationName": "MarksixFixtures",
                  "variables": {"path": SITECORE_PATH, "lang": "zh-HK"},
                  "query": QUERY,
              }, ensure_ascii=False).encode("utf-8")
              req = urllib.request.Request(API_URL, data=payload, method="POST")
              req.add_header("Content-Type", "application/json; charset=utf-8")
              req.add_header("Accept", "application/json")
              req.add_header("sc_apikey", API_KEY)
              req.add_header("Origin", "https://bet.hkjc.com")
              req.add_header("Referer", "https://bet.hkjc.com/ch/marksix/fixtures")
              req.add_header("User-Agent", "Mozilla/5.0 (compatible; LHCok-calendar-bot/1.0)")
              try:
                  with urllib.request.urlopen(req, timeout=30) as resp:
                      raw = resp.read().decode("utf-8")
              except urllib.error.HTTPError as e:
                  body = e.read().decode("utf-8", errors="replace") if e.fp else ""
                  raise RuntimeError("官网 HTTP %s: %s" % (e.code, body[:400])) from e
              data = json.loads(raw)
              if not isinstance(data, dict) or not data.get("data"):
                  raise RuntimeError("官网返回无效 JSON")
              return data

          def days_from_field(field):
              out = []
              items = (field or {}).get("date") or []
              for item in items:
                  try:
                      n = int(str((item or {}).get("value") or "").strip())
                  except (TypeError, ValueError):
                      continue
                  if 1 <= n <= 31 and n not in out:
                      out.append(n)
              out.sort()
              return out

          def parse_day_list(s):
              out = []
              for part in re.split(r"[,，、\s]+", str(s or "")):
                  part = part.strip()
                  if not part:
                      continue
                  try:
                      n = int(part)
                  except ValueError:
                      continue
                  if 1 <= n <= 31 and n not in out:
                      out.append(n)
              out.sort()
              return out

          def parse_official(data):
              years = (((data.get("data") or {}).get("item") or {}).get("years")) or []
              months = {}
              for y in years:
                  year = str((y or {}).get("year") or "").strip()
                  if not re.match(r"^\d{4}$", year):
                      continue
                  for mo in (y or {}).get("months") or []:
                      month_raw = ((mo or {}).get("month") or {}).get("value") or (mo or {}).get("key")
                      try:
                          month = int(str(month_raw).strip())
                      except (TypeError, ValueError):
                          continue
                      if month < 1 or month > 12:
                          continue
                      key = "%s.%02d" % (year, month)
                      draws = days_from_field((mo or {}).get("dates"))
                      jackpots = days_from_field((mo or {}).get("snowballs"))
                      for n in jackpots:
                          if n not in draws:
                              draws.append(n)
                      draws.sort()
                      if draws or jackpots:
                          months[key] = {"draw": draws, "jackpot": jackpots}
              return months

          def parse_existing(text):
              months = {}
              for raw in (text or "").splitlines():
                  line = raw.strip()
                  if not line or line.startswith("#"):
                      continue
                  m = LINE_RE.match(line)
                  if not m:
                      continue
                  year, month, rest = m.group(1), int(m.group(2)), m.group(3)
                  key = "%s.%02d" % (year, month)
                  jackpots = []
                  draw_part = rest
                  jidx = rest.find("金多宝")
                  if jidx >= 0:
                      draw_part = rest[:jidx].strip()
                      jackpots = parse_day_list(rest[jidx + 3:])
                  draws = parse_day_list(draw_part)
                  if draws or jackpots:
                      months[key] = {"draw": draws, "jackpot": jackpots}
              return months

          def format_file(months):
              keys = sorted(months.keys(), reverse=True)
              lines = []
              for key in keys:
                  item = months[key]
                  draws = ",".join(str(d) for d in item.get("draw") or [])
                  line = "%s: %s" % (key, draws)
                  jackpots = item.get("jackpot") or []
                  if jackpots:
                      line += " 金多宝%s" % ",".join(str(d) for d in jackpots)
                  lines.append(line.rstrip())
              return "\n".join(lines) + "\n"

          def next_month_key(now=None):
              now = now or datetime.now()
              if now.month == 12:
                  return "%d.01" % (now.year + 1)
              return "%d.%02d" % (now.year, now.month + 1)

          def main():
              print("从马会官网抓取搅珠日期...")
              official = parse_official(fetch_official())
              if not official:
                  print("官网未返回任何月份，放弃写入；后续定时会再试", file=sys.stderr)
                  return 1
              existing = {}
              if os.path.isfile(OUT_PATH):
                  with open(OUT_PATH, "r", encoding="utf-8") as f:
                      existing = parse_existing(f.read())
              else:
                  print("lottery.txt 不存在，将自动创建")
              merged = dict(existing)
              merged.update(official)
              text = format_file(merged)
              old = ""
              if os.path.isfile(OUT_PATH):
                  with open(OUT_PATH, "r", encoding="utf-8") as f:
                      old = f.read()
              nxt = next_month_key()
              has_next = nxt in official or nxt in merged
              if old.replace("\r\n", "\n") == text:
                  print("lottery.txt 无变化（官网 %d 个月份）" % len(official))
                  if datetime.now().day >= 15 and not has_next:
                      print("官网尚未公布 %s，15–28 日会继续定时抓取" % nxt)
                  return 0
              with open(OUT_PATH, "w", encoding="utf-8", newline="\n") as f:
                  f.write(text)
              print("已写入 lottery.txt，官网月份 %d，合并后 %d" % (len(official), len(merged)))
              print("---")
              print(text)
              return 0

          if __name__ == "__main__":
              sys.exit(main())
          ENDSCRIPT
          fi
          test -f fetch_hk_draw_calendar.py
          echo "开始运行 fetch_hk_draw_calendar.py"
          python fetch_hk_draw_calendar.py

      - name: 有变化则提交
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add lottery.txt fetch_hk_draw_calendar.py
          if git diff --staged --quiet; then
            echo "无变化，跳过提交"
            exit 0
          fi
          git commit -m "chore(lottery.txt): 同步马会搅珠日期 $(date '+%Y-%m-%d') [skip ci]"
          for i in 1 2 3; do
            git fetch origin main
            git rebase origin/main || (git rebase --abort && exit 1)
            git push && exit 0
            echo "Push 失败，重试 $i/3"
            sleep 2
          done
          exit 1
