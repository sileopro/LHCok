# 港彩/新澳/老澳/台彩抓取（zuikuai.py）
# - 晚间开奖窗口：北京 19:00–22:30 每 10 分钟（明确分钟，避免 */5 被 GitHub 跳过）
# - 其它时段补抓：每 2 小时（错过窗口仍能补上）
name: 彩票数据抓取
on:
  schedule:
    # ===== 晚间高频（北京 = UTC+8）=====
    # 19:00–19:50
    - cron: '0,10,20,30,40,50 11 * * *'
    # 20:00–20:50
    - cron: '0,10,20,30,40,50 12 * * *'
    # 21:00–21:50
    - cron: '0,10,20,30,40,50 13 * * *'
    # 22:00–22:30
    - cron: '0,10,20,30 14 * * *'

    # ===== 其它时段补抓（避开上面的 11–14 UTC）=====
    # 北京 00/02/04/06/08/10/12/14/16/18 点
    - cron: '0 0,2,4,6,8,10,16,18,20,22 * * *'
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: lottery-scraper-${{ github.ref }}
  cancel-in-progress: false

jobs:
  scrape-data:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
          
      - name: 设置时区
        uses: szenius/set-timezone@v1.0
        with:
          timezoneLinux: "Asia/Shanghai"
          
      - name: 设置Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'
          
      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install requests
          
      - name: 运行抓取脚本
        run: python zuikuai.py
        env:
          TZ: Asia/Shanghai
          
      - name: 检查脚本生成文件
        run: |
          ls -la *.txt
          ls -la *.json || true
          echo "===== 文件内容 ====="
          for file in *.txt *.json; do
            if [ -f "$file" ]; then
              echo "文件: $file"
              cat "$file"
              echo ""
            fi
          done
          echo "===================="
          
          
      - name: 提交更新
        id: commit-changes
        continue-on-error: true
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
          # 确保txt文件存在
          if ! ls *.txt 1> /dev/null 2>&1; then
            echo "没有找到txt文件，创建默认文件"
            echo "第001期: 36 39 14 20 28 08 特码 42 猪" > hk.txt
            echo "第001期: 36 39 14 20 28 08 特码 42 猪" > lam.txt
            echo "第001期: 36 39 14 20 28 08 特码 42 猪" > tc.txt
            echo "第001期: 36 39 14 20 28 08 特码 42 猪" > klb.txt
            echo "第001期: 36 39 14 20 28 08 特码 42 猪" > xam.txt
            echo '{"k":"001,43,19,06,22,23,34,11,002,09,09,二,21:30:00,2022","t":"1000","tool":"#492130#com","url":"","lhc":"","ok":"0"}' > hkkj.json
            echo '{"k":"001,43,19,06,22,23,34,11,002,09,09,二,21:30:00,2022","t":"1000","tool":"#492130#com","url":"","lhc":"","ok":"0"}' > lamkj.json
            echo '{"k":"001,43,19,06,22,23,34,11,002,09,09,二,21:30:00,2022","t":"1000","tool":"#492130#com","url":"","lhc":"","ok":"0"}' > tckj.json
            echo '{"k":"001,43,19,06,22,23,34,11,002,09,09,二,21:30:00,2022","t":"1000","tool":"#492130#com","url":"","lhc":"","ok":"0"}' > xamkj.json
          fi
          
          # 强制添加 txt/json/log；含 defaultData（001 清空前补档可能改动）
          git add -f *.txt *.json lottery.log
          git add -f defaultData/ 2>/dev/null || true
          
          # 即使没有变化也创建提交
          git commit -m "更新开奖结果 $(date '+%Y-%m-%d %H:%M:%S')" --allow-empty || true
          
          # 尝试推送更改
          git push origin main || true
        
      - name: 删除旧的工作流运行记录
        if: always()
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          retain_days: 7
          keep_minimum_runs: 100
